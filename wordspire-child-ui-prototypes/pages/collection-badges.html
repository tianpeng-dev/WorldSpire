<body class="min-h-screen font-sans antialiased">
<main class="ws-shell" data-style="storybook">
  <div class="ws-page-content">

    <section class="collection-badges">
      <header style="margin-bottom:20px;">
        <h1 class="ws-title">徽章墙</h1>
        <p class="ws-subtitle">你已经获得 3 / 8 枚徽章</p>
      </header>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" data-dom-id="badges-grid">
        <div class="ws-card" style="text-align:center;padding:20px;"><div style="font-size:64px;margin-bottom:8px;">🔥</div><p style="font-size:20px;font-weight:700;margin:0;">连胜 5 天</p></div>
        <div class="ws-card" style="text-align:center;padding:20px;"><div style="font-size:64px;margin-bottom:8px;">⭐</div><p style="font-size:20px;font-weight:700;margin:0;">100 星达成</p></div>
        <div class="ws-card" style="text-align:center;padding:20px;"><div style="font-size:64px;margin-bottom:8px;">🏆</div><p style="font-size:20px;font-weight:700;margin:0;">对战首胜</p></div>
        <div class="ws-card ws-locked" style="text-align:center;padding:20px;"><div style="font-size:64px;margin-bottom:8px;">🔒</div><p style="font-size:20px;font-weight:700;margin:0;">解锁 10 词</p></div>
      </div>
      <div style="margin-top:24px;text-align:center;">
        <button class="ws-button ws-button-secondary" style="min-width:240px;" data-dom-id="badges-to-chars" onclick="location.href='collection-characters.html'">查看角色</button>
      </div>
    </section>
  </div>
  <nav class="ws-bottom-nav">

    <button class="ws-nav-item" data-nav-key="home" data-dom-id="nav-home"  onclick="location.href='home.html'">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>首页</span>
    </button>
    <button class="ws-nav-item" data-nav-key="map" data-dom-id="nav-map"  onclick="location.href='map.html'">
      <svg viewBox="0 0 24 24"><path d="M20.5 3l-6 1.5-5.5-1.5-6 1.5v15l6-1.5 5.5 1.5 6-1.5V3z"/></svg>
      <span>闯关</span>
    </button>
    <button class="ws-nav-item" data-nav-key="battle" data-dom-id="nav-battle"  onclick="location.href='battle-lobby.html'">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>对战</span>
    </button>
    <button class="ws-nav-item" data-nav-key="collection" data-dom-id="nav-collection" data-active="true" onclick="location.href='collection-characters.html'">
      <svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
      <span>收藏</span>
    </button>
  </nav>
</main>
<script>lucide.createIcons();</script>
</body>
