name: Backend checks
on:
  push:
    paths: ["wordspire-app/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["wordspire-app/**", ".github/workflows/backend.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordspire-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wordspire_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/wordspire_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wordspire_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-auth-secret-for-isolated-validation-only
      CRON_SECRET: ci-cron-secret-for-isolated-validation-only
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: wordspire-app/.nvmrc
          cache: npm
          cache-dependency-path: wordspire-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:integration:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-validation-log
          path: wordspire-app/.work/*server.log
