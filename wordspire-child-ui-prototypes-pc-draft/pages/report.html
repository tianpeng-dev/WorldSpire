<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学习报告 · 词灵塔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style id="theme-vars">
:root {
  --ws-background: #FFF8E7;
  --ws-foreground: #3E2723;
  --ws-card: #FFFFFF;
  --ws-card-foreground: #3E2723;
  --ws-popover: #FFFFFF;

  --ws-border: rgba(62, 39, 35, 0.12);
  --ws-input: #FFFFFF;
  --ws-ring: #E85D4C;
  --ws-primary-50: #FDF2F0;
  --ws-primary-100: #FADBD7;
  --ws-primary-200: #F5B7AE;
  --ws-primary-300: #EF9285;
  --ws-primary-400: #E85D4C;
  --ws-primary-500: #D64A3A;
  --ws-primary-600: #B53A2C;
  --ws-neutral-50: #FFFDF8;
  --ws-neutral-100: #FFF8E7;
  --ws-neutral-200: #F5E6D3;
  --ws-neutral-300: #E6D2BA;
  --ws-neutral-400: #A1887F;
  --ws-neutral-500: #6D4C41;
  --ws-neutral-600: #3E2723;
  --ws-state-success: #10B981;
  --ws-state-success-soft: rgba(16, 185, 129, 0.12);
  --ws-state-warning: #F59E0B;
  --ws-state-warning-soft: rgba(245, 158, 11, 0.12);
  --ws-state-error: #EF4444;
  --ws-state-error-soft: rgba(239, 68, 68, 0.12);
  --ws-state-info: #3B82F6;
  --ws-state-info-soft: rgba(59, 130, 246, 0.12);
  --ws-gold: #F4C542;
  --ws-sage: #7DB9A8;
  --ws-radius-small: 8px;
  --ws-radius-medium: 12px;
  --ws-radius-large: 16px;
  --ws-font-display: 'ZCOOL QingKe HuangYou', 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --ws-font-body: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --ws-font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ws-background);
    --color-foreground: var(--ws-foreground);
    --color-card: var(--ws-card);
    --color-card-foreground: var(--ws-card-foreground);
    --color-popover: var(--ws-popover);
    --color-popover-foreground: var(--ws-popover-foreground);
    --color-primary: var(--ws-primary);
    --color-primary-foreground: var(--ws-primary-foreground);
    --color-muted: var(--ws-muted);
    --color-muted-foreground: var(--ws-muted-foreground);
    --color-border: var(--ws-border);
    --color-input: var(--ws-input);
    --color-ring: var(--ws-ring);
    --radius-sm: var(--ws-radius-small);
    --radius-md: var(--ws-radius-medium);
    --radius-lg: var(--ws-radius-large);
  }
  @layer base {
    body { background: var(--ws-background); color: var(--ws-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
  </style>
  <style id="semantic-token-fallback">
    .bg-background { background-color: var(--ws-background); }
    .text-background { color: var(--ws-background); }
    .border-background { border-color: var(--ws-background); }
    .ring-background { --tw-ring-color: var(--ws-background); }
    .bg-foreground { background-color: var(--ws-foreground); }
    .text-foreground { color: var(--ws-foreground); }
    .border-foreground { border-color: var(--ws-foreground); }
    .ring-foreground { --tw-ring-color: var(--ws-foreground); }
    .bg-card { background-color: var(--ws-card); }
    .text-card { color: var(--ws-card); }
    .border-card { border-color: var(--ws-card); }
    .ring-card { --tw-ring-color: var(--ws-card); }
    .bg-card-foreground { background-color: var(--ws-card-foreground); }
    .text-card-foreground { color: var(--ws-card-foreground); }
    .border-card-foreground { border-color: var(--ws-card-foreground); }
    .ring-card-foreground { --tw-ring-color: var(--ws-card-foreground); }
    .bg-popover { background-color: var(--ws-popover); }
    .text-popover { color: var(--ws-popover); }
    .border-popover { border-color: var(--ws-popover); }
    .ring-popover { --tw-ring-color: var(--ws-popover); }
    .bg-popover-foreground { background-color: var(--ws-popover-foreground); }
    .text-popover-foreground { color: var(--ws-popover-foreground); }
    .border-popover-foreground { border-color: var(--ws-popover-foreground); }
    .ring-popover-foreground { --tw-ring-color: var(--ws-popover-foreground); }
    .bg-primary { background-color: var(--ws-primary); }
    .text-primary { color: var(--ws-primary); }
    .border-primary { border-color: var(--ws-primary); }
    .ring-primary { --tw-ring-color: var(--ws-primary); }
    .bg-primary-foreground { background-color: var(--ws-primary-foreground); }
    .text-primary-foreground { color: var(--ws-primary-foreground); }
    .border-primary-foreground { border-color: var(--ws-primary-foreground); }
    .ring-primary-foreground { --tw-ring-color: var(--ws-primary-foreground); }
    .bg-muted { background-color: var(--ws-muted); }
    .text-muted { color: var(--ws-muted); }
    .border-muted { border-color: var(--ws-muted); }
    .ring-muted { --tw-ring-color: var(--ws-muted); }
    .bg-muted-foreground { background-color: var(--ws-muted-foreground); }
    .text-muted-foreground { color: var(--ws-muted-foreground); }
    .border-muted-foreground { border-color: var(--ws-muted-foreground); }
    .ring-muted-foreground { --tw-ring-color: var(--ws-muted-foreground); }
    .bg-border { background-color: var(--ws-border); }
    .text-border { color: var(--ws-border); }
    .border-border { border-color: var(--ws-border); }
    .ring-border { --tw-ring-color: var(--ws-border); }
    .bg-input { background-color: var(--ws-input); }
    .text-input { color: var(--ws-input); }
    .border-input { border-color: var(--ws-input); }
    .ring-input { --tw-ring-color: var(--ws-input); }
    .bg-ring { background-color: var(--ws-ring); }
    .text-ring { color: var(--ws-ring); }
    .border-ring { border-color: var(--ws-ring); }
    .ring-ring { --tw-ring-color: var(--ws-ring); }
  </style>
  <link rel="stylesheet" href="../colors_and_type-storybook-draft.css">
  <link rel="stylesheet" href="../shared-components.css">
  <style>
    .ws-shell { background: #FFF8E7; }
    .ws-page-content { padding: 40px; margin-left: 220px; max-width: 1200px; }
    .ws-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      height: 100vh;
      background: linear-gradient(180deg, #FFF0D4 0%, #FFE4C0 100%);
      border-right: 2px solid rgba(62, 39, 35, 0.08);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 100;
    }
    .ws-sidebar-logo {
      font-family: var(--ws-font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--ws-primary);
      text-align: center;
      margin-bottom: 32px;
    }
    .ws-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .ws-sidebar-nav .ws-nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: none;
      color: var(--ws-muted-foreground);
      font-family: var(--ws-font-body);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      padding: 14px 18px;
      border-radius: var(--ws-radius-large);
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .ws-sidebar-nav .ws-nav-item svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .ws-sidebar-nav .ws-nav-item:hover { transform: translateX(4px); }
    .ws-sidebar-nav .ws-nav-item[data-active="true"] {
      color: var(--ws-primary);
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 2px 8px rgba(232, 93, 76, 0.15);
    }
    .report-overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .report-stat-label { font-size: 18px; color: var(--ws-muted-foreground); margin: 0; }
    .report-stat-value { font-size: 36px; font-weight: 800; margin: 8px 0 0; color: var(--ws-primary); }
    .report-abilities-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .report-ability-item + .report-ability-item { margin-top: 16px; }
    .report-ability-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 18px; font-weight: 700; }
    .report-ability-value { color: var(--ws-primary); }
    .report-achievements { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .report-achievement { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: var(--ws-radius-large); background: var(--ws-primary-50); color: var(--ws-primary); border: 1px solid var(--ws-border); font-size: 18px; font-weight: 700; }
    .report-achievement-icon { width: 24px; height: 24px; color: var(--ws-gold); }
    .report-section-title { font-size: 24px; margin: 0 0 16px; }
    @media (max-width: 1100px) {
      .report-overview { grid-template-columns: repeat(2, 1fr); }
      .report-abilities-grid { grid-template-columns: 1fr; }
      .report-achievements { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
<main class="ws-shell" data-style="storybook">
  <aside class="ws-sidebar" data-dom-id="sidebar">
    <div class="ws-sidebar-logo" data-dom-id="sidebar-logo">词灵塔</div>
    <nav class="ws-sidebar-nav" data-dom-id="sidebar-nav">
      <button class="ws-nav-item" data-nav-key="home" data-dom-id="nav-home" onclick="location.href='home.html'">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </button>
      <button class="ws-nav-item" data-nav-key="map" data-dom-id="nav-map" onclick="location.href='map.html'">
        <svg viewBox="0 0 24 24"><path d="M20.5 3l-6 1.5-5.5-1.5-6 1.5v15l6-1.5 5.5 1.5 6-1.5V3z"/></svg>
        <span>闯关</span>
      </button>
      <button class="ws-nav-item" data-nav-key="battle" data-dom-id="nav-battle" onclick="location.href='battle-lobby.html'">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>对战</span>
      </button>
      <button class="ws-nav-item" data-nav-key="collection" data-dom-id="nav-collection" onclick="location.href='collection-characters.html'">
        <svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
        <span>收藏</span>
      </button>
      <button class="ws-nav-item" data-nav-key="report" data-dom-id="nav-report" data-active="true" onclick="location.href='report.html'">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>报告</span>
      </button>
    </nav>
  </aside>

  <div class="ws-page-content">

    <section class="report">
      <header style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
        <button class="ws-button ws-button-secondary" style="min-height:48px;padding:10px 16px;" data-dom-id="report-back" onclick="location.href='home-v2.html'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1 class="ws-title" style="margin-bottom:0;">学习报告</h1>
      </header>

      <div class="ws-card" style="margin-bottom:20px;" data-dom-id="report-overview">
        <h2 class="report-section-title">本周总览</h2>
        <div class="report-overview">
          <div class="ws-card" data-dom-id="report-new-words" style="padding:20px;">
            <p class="report-stat-label">本周新词</p>
            <p class="report-stat-value">14</p>
          </div>
          <div class="ws-card" data-dom-id="report-accuracy" style="padding:20px;">
            <p class="report-stat-label">拼读准确率</p>
            <p class="report-stat-value">74%</p>
          </div>
          <div class="ws-card" data-dom-id="report-streak" style="padding:20px;">
            <p class="report-stat-label">连续打卡</p>
            <p class="report-stat-value">5 天</p>
          </div>
          <div class="ws-card" data-dom-id="report-stars" style="padding:20px;">
            <p class="report-stat-label">累计星星</p>
            <p class="report-stat-value">128</p>
          </div>
        </div>
      </div>

      <div class="ws-card" style="margin-bottom:20px;" data-dom-id="report-abilities">
        <h2 class="report-section-title">能力趋势</h2>
        <div class="report-abilities-grid">
          <div class="report-abilities-column" data-dom-id="report-abilities-left">
            <div class="report-ability-item" data-dom-id="report-ability-listening">
              <div class="report-ability-header">
                <span>听力</span>
                <span class="report-ability-value">78%</span>
              </div>
              <div class="ws-progress-bar"><div class="fill" style="width:78%;"></div></div>
            </div>
            <div class="report-ability-item" data-dom-id="report-ability-speaking">
              <div class="report-ability-header">
                <span>口语</span>
                <span class="report-ability-value">65%</span>
              </div>
              <div class="ws-progress-bar"><div class="fill" style="width:65%;"></div></div>
            </div>
          </div>
          <div class="report-abilities-column" data-dom-id="report-abilities-right">
            <div class="report-ability-item" data-dom-id="report-ability-spelling">
              <div class="report-ability-header">
                <span>拼读</span>
                <span class="report-ability-value">74%</span>
              </div>
              <div class="ws-progress-bar"><div class="fill" style="width:74%;"></div></div>
            </div>
            <div class="report-ability-item" data-dom-id="report-ability-vocabulary">
              <div class="report-ability-header">
                <span>词汇</span>
                <span class="report-ability-value">82%</span>
              </div>
              <div class="ws-progress-bar"><div class="fill" style="width:82%;"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="ws-card" style="margin-bottom:20px;" data-dom-id="report-achievements">
        <h2 class="report-section-title">最近成就</h2>
        <div class="report-achievements">
          <div class="report-achievement" data-dom-id="report-achievement-streak">
            <svg class="report-achievement-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            连胜 3 天
          </div>
          <div class="report-achievement" data-dom-id="report-achievement-levels">
            <svg class="report-achievement-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 17.9V19H7v2h10v-2h-4v-1.1a5.01 5.01 0 003.61-4.94C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.5C5.62 9.9 5 9.05 5 8zm14 0c0 1.05-.62 1.9-2 2.5V7h2v1z"/></svg>
            闯关 10 关
          </div>
          <div class="report-achievement" data-dom-id="report-achievement-pronunciation">
            <svg class="report-achievement-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            发音小达人
          </div>
        </div>
      </div>

      <div class="ws-card" data-dom-id="report-study-time">
        <h2 class="report-section-title">学习时长</h2>
        <p style="font-size:18px;color:var(--ws-muted-foreground);margin:0;">本周累计</p>
        <p style="font-size:36px;font-weight:800;margin:8px 0 0;color:var(--ws-primary);">2 小时 15 分钟</p>
      </div>
    </section>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
