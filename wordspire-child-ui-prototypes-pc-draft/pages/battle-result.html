    --color-primary: var(--ws-primary);
    --color-primary-foreground: var(--ws-primary-foreground);
    --color-muted: var(--ws-muted);
    --color-muted-foreground: var(--ws-muted-foreground);
    --color-border: var(--ws-border);
    --color-input: var(--ws-input);
    --color-ring: var(--ws-ring);
    --radius-sm: var(--ws-radius-small);
    --radius-md: var(--ws-radius-medium);
    --radius-lg: var(--ws-radius-large);
  }
  @layer base {
    body { background: var(--ws-background); color: var(--ws-foreground); }

  <link rel="stylesheet" href="../colors_and_type-storybook-draft.css">

  <style>
    .ws-shell { background: #FFF8E7; }
    .ws-page-content { padding: 40px; margin-left: 220px; max-width: 1200px; }

    .ws-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 220px;
      background: linear-gradient(180deg, #FFFDF8 0%, #FFF8E7 100%);
      border-right: 2px dashed rgba(62, 39, 35, 0.12);
      display: flex;
      flex-direction: column;
      padding: 32px 16px;
      gap: 16px;
      z-index: 100;
      box-shadow: 4px 0 0 rgba(62, 39, 35, 0.06);
    }

    .ws-sidebar .ws-nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: 2px solid transparent;
      color: var(--ws-muted-foreground);
      font-family: var(--ws-font-body);
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      padding: 16px 18px;
      border-radius: var(--ws-radius-large);
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .ws-sidebar .ws-nav-item:hover { transform: translateX(4px); }

    .ws-sidebar .ws-nav-item svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .ws-sidebar .ws-nav-item[data-active="true"] {
      color: var(--ws-primary-foreground);
      background: var(--ws-primary);
      border-color: var(--ws-primary-600);
      box-shadow: 4px 4px 0 rgba(181, 58, 44, 0.25);
    }

    .ws-sidebar .ws-nav-item[data-nav-key="home"]:not([data-active="true"]) { color: #3B82F6; background: rgba(59, 130, 246, 0.08); }
    .ws-sidebar .ws-nav-item[data-nav-key="map"]:not([data-active="true"]) { color: #10B981; background: rgba(16, 185, 129, 0.08); }
    .ws-sidebar .ws-nav-item[data-nav-key="battle"]:not([data-active="true"]) { color: #E85D4C; background: rgba(232, 93, 76, 0.08); }
    .ws-sidebar .ws-nav-item[data-nav-key="collection"]:not([data-active="true"]) { color: #F59E0B; background: rgba(245, 158, 11, 0.08); }
    .ws-sidebar .ws-nav-item[data-nav-key="report"]:not([data-active="true"]) { color: #8B5CF6; background: rgba(139, 92, 246, 0.08); }

    .result-card {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }

    .result-card .ws-title {
      font-size: 56px;
      margin-bottom: 20px;
    }

    .result-card .ws-subtitle {
      font-size: 26px;
      margin-bottom: 32px;
    }

    .score-board {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: center;
      margin-bottom: 32px;
    }

    .score-board .score-player {
      background: var(--ws-card);
      border: 2px solid var(--ws-border);
      border-radius: var(--ws-radius-large);
      padding: 28px 20px;
      box-shadow: 4px 4px 0 rgba(62, 39, 35, 0.08);
    }

    .score-board .score-player.winner {
      border-color: var(--ws-state-success);
      background: rgba(16, 185, 129, 0.06);
    }

    .score-board .score-player .name {
      font-size: 22px;
      font-weight: 700;
      color: var(--ws-muted-foreground);
      margin: 0 0 12px;
    }

    .score-board .score-player .score {
      font-size: 56px;
      font-weight: 800;
      color: var(--ws-foreground);
      margin: 0;
      line-height: 1;
    }

    .score-board .score-player.winner .score { color: var(--ws-state-success); }

    .score-board .score-divider {
      font-size: 28px;
      font-weight: 800;
      color: var(--ws-muted-foreground);
    }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .result-stats .ws-card p:first-child {
      font-size: 20px;
      color: var(--ws-muted-foreground);
      margin: 0;
    }

    .result-stats .ws-card p:last-child {
      font-size: 44px;
      font-weight: 800;
      margin: 8px 0 0;
      color: var(--ws-primary);
    }

    .result-rank {
      margin-bottom: 32px;
      text-align: left;
    }

    .result-rank p:first-child { font-size: 24px; font-weight: 700; margin: 0; }
    .result-rank p:last-child { font-size: 20px; color: var(--ws-muted-foreground); margin: 10px 0 0; }

    .result-actions {
      display: flex;
      gap: 16px;
    }

    .result-actions .ws-button {
      flex: 1;
      min-height: 64px;
      font-size: 24px;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
<main class="ws-shell" data-style="storybook">
  <nav class="ws-sidebar" aria-label="主导航">
    <button class="ws-nav-item" data-nav-key="home" data-dom-id="nav-home" onclick="location.href='home.html'">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>首页</span>
    </button>
    <button class="ws-nav-item" data-nav-key="map" data-dom-id="nav-map" onclick="location.href='map.html'">
      <svg viewBox="0 0 24 24"><path d="M20.5 3l-6 1.5-5.5-1.5-6 1.5v15l6-1.5 5.5 1.5 6-1.5V3z"/></svg>
      <span>闯关</span>
    </button>
    <button class="ws-nav-item" data-nav-key="battle" data-dom-id="nav-battle" data-active="true" onclick="location.href='battle-lobby.html'">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>对战</span>
    </button>
    <button class="ws-nav-item" data-nav-key="collection" data-dom-id="nav-collection" onclick="location.href='collection-characters.html'">
      <svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
      <span>收藏</span>
    </button>
    <button class="ws-nav-item" data-nav-key="report" data-dom-id="nav-report" onclick="location.href='report.html'">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>报告</span>
    </button>
  </nav>

  <div class="ws-page-content">
    <section class="battle-result result-card">
      <div data-dom-id="result-trophy" style="font-size:120px;margin-bottom:16px;">🏆</div>
      <h1 class="ws-title" style="color:var(--ws-state-success);">你赢了！</h1>
      <p class="ws-subtitle">小芳 3 : 1 小塔</p>

      <div class="score-board" data-dom-id="result-scoreboard">
        <div class="score-player winner">
          <p class="name">小芳</p>
          <p class="score">3</p>
        </div>
        <div class="score-divider">:</div>
        <div class="score-player">
          <p class="name">小塔</p>
          <p class="score">1</p>
        </div>
      </div>

      <div class="result-stats" data-dom-id="result-stats">
        <div class="ws-card"><p>连胜</p><p>+1</p></div>
        <div class="ws-card"><p>获得星星</p><p>+10</p></div>
      </div>
      <div class="ws-card result-rank" data-dom-id="result-rank">
        <p>本周排名：第 3 名</p>
        <p>再赢 1 场就能升到第 2 名</p>
      </div>
      <div class="result-actions">
        <button class="ws-button" data-dom-id="result-again" onclick="location.href='battle-play.html'">再来一局</button>
        <button class="ws-button ws-button-secondary" data-dom-id="result-back" onclick="location.href='home.html'">回首页</button>
      </div>
    </section>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
