  <style>
    .ws-shell { background: #FFF8E7; }
    .ws-page-content { padding: 40px; margin-left: 220px; max-width: 1200px; }

    .ws-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      height: 100vh;
      background: linear-gradient(180deg, #E85D4C 0%, #D64A3A 100%);
      display: flex;
      flex-direction: column;
      padding: 32px 16px 24px;
      z-index: 100;
      box-shadow: 4px 0 16px rgba(62, 39, 35, 0.12);
    }

    .ws-sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #FFFFFF;
      font-family: var(--ws-font-display);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 40px;
      text-shadow: 2px 2px 0 rgba(62, 39, 35, 0.16);
    }

    .ws-sidebar-brand svg {
      width: 40px;
      height: 40px;
      fill: currentColor;
    }

    .ws-sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ws-sidebar-nav .ws-nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.82);
      font-family: var(--ws-font-body);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      padding: 14px 18px;
      border-radius: var(--ws-radius-large);
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .ws-sidebar-nav .ws-nav-item svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .ws-sidebar-nav .ws-nav-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .ws-sidebar-nav .ws-nav-item[data-active="true"] {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
    }

    .battle-lobby { width: 100%; }

    .battle-lobby header { margin-bottom: 32px; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 36px 28px;
    }

    .mode-card .mode-icon {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .mode-card h2 {
      font-family: var(--ws-font-display);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ws-foreground);
    }

    .mode-card p {
      font-size: 20px;
      color: var(--ws-muted-foreground);
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 420px;
    }

    .mode-card .mode-meta {
      width: 100%;
      background: var(--ws-primary-50);
      border-radius: var(--ws-radius-medium);
      padding: 18px 20px;
      margin-bottom: 24px;
      text-align: left;
    }

    .mode-card .mode-meta p {
      margin: 0;
      font-size: 18px;
      color: var(--ws-foreground);
    }

    .mode-card .mode-meta p + p {
      margin-top: 8px;
      color: var(--ws-muted-foreground);
    }

    .mode-card .ws-button {
      min-width: 220px;
      margin-top: auto;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
<aside class="ws-sidebar" data-dom-id="sidebar">

    <span>词灵塔</span>
  </div>

    </button>
    <button class="ws-nav-item" data-nav-key="battle" data-dom-id="nav-battle" data-active="true" onclick="location.href='battle-lobby.html'">

      <span>对战</span>
    </button>
    <button class="ws-nav-item" data-nav-key="collection" data-dom-id="nav-collection" onclick="location.href='collection-characters.html'">
      <svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
      <span>收藏</span>
    </button>
    <button class="ws-nav-item" data-nav-key="report" data-dom-id="nav-report" onclick="location.href='report.html'">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>报告</span>
    </button>
  </nav>
</aside>
<main class="ws-shell" data-style="storybook">
  <div class="ws-page-content">

    <section class="battle-lobby">
      <header>
        <h1 class="ws-title">对战大厅</h1>
        <p class="ws-subtitle">挑战小塔，或接受妈妈的亲子 PK</p>
      </header>
      <div class="mode-grid">
        <div class="ws-card mode-card" data-dom-id="lobby-ai">
          <div class="mode-icon">🤖</div>
          <h2>挑战小塔</h2>
          <p>AI 对手会按你的水平出题，离线也能玩</p>
          <button class="ws-button" data-dom-id="lobby-ai-start" onclick="location.href='battle-play.html'">开始对战</button>
        </div>
        <div class="ws-card mode-card" data-dom-id="lobby-parent">
          <div class="mode-icon">👩</div>
          <h2>亲子 PK</h2>
          <p>妈妈发来挑战，接受就能开始</p>
          <div class="mode-meta">
            <p style="font-size:18px;font-weight:700;margin:0;">妈妈的挑战：水果王国 · 第 2 关</p>
            <p style="font-size:16px;color:var(--ws-muted-foreground);margin:8px 0 0;">“周末一起比一比？”</p>
          </div>
          <button class="ws-button" data-dom-id="lobby-parent-accept" onclick="location.href='battle-play.html'">接受挑战</button>
        </div>
      </div>
    </section>
  </div>
</main>
<script>lucide.createIcons();</script>
