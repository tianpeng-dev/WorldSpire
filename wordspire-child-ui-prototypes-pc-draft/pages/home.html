  <link rel="stylesheet" href="../colors_and_type-storybook-draft.css">

  <style>
    body { padding-bottom: 0; }
    .ws-shell { background: #FFF8E7; }
    .ws-page-content { padding: 40px; margin-left: 220px; margin-right: auto; max-width: 1200px; }

    .ws-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: 100vh;
      background: linear-gradient(180deg, #FCE7CD 0%, #FADBD7 100%);
      border-right: 2px dashed rgba(62, 39, 35, 0.12);
      display: flex;
      flex-direction: column;
      padding: 28px 16px 24px;
      box-sizing: border-box;
      z-index: 50;
    }

    .ws-sidebar-logo {
      font-family: var(--ws-font-display);
      font-size: 32px;
      color: var(--ws-primary);
      text-align: center;
      margin: 0 0 36px;
      text-shadow: 2px 2px 0 rgba(232, 93, 76, 0.15);
    }

    .ws-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .ws-sidebar-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: var(--ws-radius-large);
      background: var(--ws-card);
      color: var(--ws-muted-foreground);
      border: 2px solid transparent;
      box-shadow: 0 3px 0 rgba(62, 39, 35, 0.06);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      font-family: var(--ws-font-display);
      font-size: 22px;
      text-decoration: none;
    }

    .ws-sidebar-item:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(62, 39, 35, 0.08); }

    .ws-sidebar-item svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .ws-sidebar-item[data-active="true"] {
      background: var(--ws-primary);
      color: var(--ws-primary-foreground);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 0 #B53A2C;
    }

    .ws-sidebar-item[data-active="true"]:hover { box-shadow: 0 6px 0 #B53A2C; }

    .ws-sidebar-item[data-key="home"] { color: #E85D4C; }
    .ws-sidebar-item[data-key="home"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="map"] { color: #3B82F6; }
    .ws-sidebar-item[data-key="map"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="battle"] { color: #F59E0B; }
    .ws-sidebar-item[data-key="battle"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="collection"] { color: #10B981; }
    .ws-sidebar-item[data-key="collection"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="report"] { color: #8B5CF6; }
    .ws-sidebar-item[data-key="report"][data-active="true"] { color: #FFFFFF; }

    .home header { margin-bottom: 28px; }
    .home h1.ws-title { font-size: 42px; }
    .ws-hero { margin-bottom: 32px; }
    .home .ws-card { padding: 32px; }
    .home-task { margin-bottom: 28px; }
    .home-task h2 { font-size: 28px; }
    .home-task .ws-button { flex: 1; min-height: 72px; font-size: 26px; }
    .home-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .home-stats .ws-card p:first-child { font-size: 20px; }
    .home-stats .ws-card p:last-child { font-size: 44px; margin-top: 12px; }

    @media (max-width: 991px) {
      .ws-page-content { margin-left: 0; padding: 24px; }
      .ws-sidebar { display: none; }
      .home-task .ws-button { min-height: 56px; font-size: 22px; }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
<main class="ws-shell" data-style="storybook">
  <aside class="ws-sidebar" data-dom-id="pc-sidebar">
    <h2 class="ws-sidebar-logo">词灵塔</h2>
    <nav class="ws-sidebar-nav">
      <button class="ws-sidebar-item" data-key="home" data-dom-id="nav-home" data-active="true" onclick="location.href='home.html'">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </button>
      <button class="ws-sidebar-item" data-key="map" data-dom-id="nav-map" onclick="location.href='map.html'">
        <svg viewBox="0 0 24 24"><path d="M20.5 3l-6 1.5-5.5-1.5-6 1.5v15l6-1.5 5.5 1.5 6-1.5V3z"/></svg>
        <span>闯关</span>
      </button>
      <button class="ws-sidebar-item" data-key="battle" data-dom-id="nav-battle" onclick="location.href='battle-lobby.html'">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>对战</span>
      </button>
      <button class="ws-sidebar-item" data-key="collection" data-dom-id="nav-collection" onclick="location.href='collection-characters.html'">
        <svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
        <span>收藏</span>
      </button>
      <button class="ws-sidebar-item" data-key="report" data-dom-id="nav-report" onclick="location.href='report.html'">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>报告</span>
      </button>
    </nav>
  </aside>

  <div class="ws-page-content">
    <section class="home">
      <header style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <p style="font-size:18px;color:var(--ws-muted-foreground);margin:0;">下午好，小芳</p>
          <h1 class="ws-title" style="margin-bottom:0;">词灵塔</h1>
        </div>
        <div style="display:flex;gap:12px;">
          <div class="ws-badge" data-dom-id="home-streak"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>5 天连胜</div>
          <div class="ws-badge" data-dom-id="home-stars"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>128 星</div>
        </div>
      </header>
      <div class="ws-hero" data-dom-id="home-hero">
        <img src="../assets/hero-wordspire-storybook.jpg" alt="今日主题">
      </div>
      <div class="ws-card home-task" data-dom-id="home-task">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="font-size:28px;margin:0;">今日任务</h2>
          <span style="font-size:20px;color:var(--ws-muted-foreground);">3/5 完成</span>
        </div>
        <div class="ws-progress-bar"><div class="fill" style="width:60%;"></div></div>
        <div style="display:flex;gap:16px;margin-top:20px;">
          <button class="ws-button" style="flex:1;" data-dom-id="home-continue" onclick="location.href='map.html'">继续闯关</button>
          <button class="ws-button ws-button-secondary" style="flex:1;" data-dom-id="home-battle" onclick="location.href='battle-lobby.html'">去对战</button>
        </div>
      </div>
      <div class="home-stats">
        <div class="ws-card" data-dom-id="home-weekly">
          <p style="font-size:20px;color:var(--ws-muted-foreground);margin:0;">本周新词</p>
          <p style="font-size:44px;font-weight:800;margin:12px 0 0;color:var(--ws-primary);">14</p>
        </div>
        <div class="ws-card" data-dom-id="home-accuracy">
          <p style="font-size:20px;color:var(--ws-muted-foreground);margin:0;">拼读准确率</p>
          <p style="font-size:44px;font-weight:800;margin:12px 0 0;color:var(--ws-primary);">74%</p>
        </div>
      </div>
    </section>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
