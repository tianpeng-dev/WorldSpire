  <style>
    body { padding-bottom: 0; }
    .ws-shell { background: var(--ws-background); min-height: 100vh; }

    /* ---------- 侧边栏 ---------- */
    .ws-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: 100vh;
      background: linear-gradient(180deg, #FCE7CD 0%, #FADBD7 100%);
      border-right: 2px dashed rgba(62, 39, 35, 0.14);
      display: flex;
      flex-direction: column;
      padding: 28px 16px 24px;
      box-sizing: border-box;
      z-index: 50;
    }

    .ws-sidebar-logo {
      font-family: var(--ws-font-display);
      font-size: 32px;
      color: var(--ws-primary);
      text-align: center;
      margin: 0 0 36px;
      text-shadow: 2px 2px 0 rgba(232, 93, 76, 0.15);
    }

    .ws-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .ws-sidebar-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: var(--ws-radius-large);
      background: var(--ws-card);
      color: var(--ws-muted-foreground);
      border: 2px solid transparent;
      box-shadow: 0 3px 0 rgba(62, 39, 35, 0.06);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
      font-family: var(--ws-font-display);
      font-size: 22px;
      text-decoration: none;
    }

    .ws-sidebar-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 rgba(62, 39, 35, 0.08);
    }

    .ws-sidebar-item:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ws-ring), 0 5px 0 rgba(62, 39, 35, 0.08);
    }

    .ws-sidebar-item:active {
      transform: translateY(0);
      box-shadow: 0 1px 0 rgba(62, 39, 35, 0.08);
    }

    .ws-sidebar-item svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .ws-sidebar-item[data-active="true"] {
      background: var(--ws-primary);
      color: var(--ws-primary-foreground);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 0 #B53A2C;
    }

    .ws-sidebar-item[data-active="true"]:hover { box-shadow: 0 6px 0 #B53A2C; }
    .ws-sidebar-item[data-active="true"]:active { box-shadow: 0 2px 0 #B53A2C; transform: translateY(0); }

    .ws-sidebar-item[data-key="home"] { color: #E85D4C; }
    .ws-sidebar-item[data-key="home"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="map"] { color: #3B82F6; }
    .ws-sidebar-item[data-key="map"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="battle"] { color: #F59E0B; }
    .ws-sidebar-item[data-key="battle"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="collection"] { color: #10B981; }
    .ws-sidebar-item[data-key="collection"][data-active="true"] { color: #FFFFFF; }
    .ws-sidebar-item[data-key="report"] { color: #8B5CF6; }
    .ws-sidebar-item[data-key="report"][data-active="true"] { color: #FFFFFF; }

    /* ---------- 主内容区 ---------- */
    .ws-page-content {
      margin-left: 220px;
      padding: 40px;
    }

    .ws-page-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ---------- 首页头部 ---------- */
    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 32px;
    }

    .home-greeting {
      font-size: 18px;
      color: var(--ws-muted-foreground);
      margin: 0 0 4px;
    }

    .home-title {
      font-family: var(--ws-font-display);
      font-size: 42px;
      font-weight: 700;
      color: var(--ws-foreground);
      margin: 0;
      line-height: 1.2;
    }

    .home-badges {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .home-profile-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 2px solid var(--ws-primary);
      background: var(--ws-card);
      color: var(--ws-primary);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      flex-shrink: 0;
    }

    .home-profile-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 0 rgba(232, 93, 76, 0.18);
      background: var(--ws-primary-50);
    }

    .home-profile-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ws-ring), 0 4px 0 rgba(232, 93, 76, 0.18);
    }

    .home-profile-btn:active { transform: scale(0.96); }

    .home-profile-btn svg {
      width: 26px;
      height: 26px;
    }

    /* ---------- 首页两栏主体 ---------- */
    .home-main {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 40px;
      align-items: start;
      margin-bottom: 32px;
    }

    .home-hero {
      position: relative;
      border-radius: var(--ws-radius-large);
      overflow: hidden;
      border: 3px solid rgba(62, 39, 35, 0.08);
      box-shadow: 6px 6px 0 rgba(62, 39, 35, 0.06);
      background: var(--ws-card);
    }

    .home-hero img {
      width: 100%;
      height: auto;
      max-height: 460px;
      object-fit: cover;
      display: block;
    }

    .home-actions-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .home-actions .ws-button {
      width: 100%;
      min-height: 80px;
      font-size: 28px;
      padding: 20px 36px;
      border-radius: var(--ws-radius-large);
      justify-content: flex-start;
      gap: 16px;
      box-shadow: 0 4px 0 rgba(62, 39, 35, 0.08);
    }

    .home-actions .ws-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(62, 39, 35, 0.1);
    }

    .home-actions .ws-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ws-ring), 0 6px 0 rgba(62, 39, 35, 0.1);
    }

    .home-actions .ws-button:active {
      transform: translateY(0);
      box-shadow: 0 1px 0 rgba(62, 39, 35, 0.1);
    }

    .home-actions .ws-button-secondary {
      background: var(--ws-card);
      color: var(--ws-foreground);
      border: 2px solid var(--ws-border);
    }

    .home-actions .ws-button-secondary:hover {
      background: var(--ws-neutral-50);
      border-color: var(--ws-primary-200);
    }

    .home-actions .ws-button svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .home-task-card {
      padding: 24px;
      background: var(--ws-card);
      border-radius: var(--ws-radius-large);
      border: 1px solid var(--ws-border);
      box-shadow: 4px 4px 0 rgba(62, 39, 35, 0.06);
    }

    .home-task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .home-task-title {
      font-family: var(--ws-font-display);
      font-size: 26px;
      margin: 0;
    }

    .home-task-count {
      font-size: 18px;
      color: var(--ws-muted-foreground);
      font-weight: 700;
    }

    .home-task-card .ws-progress-bar {
      height: 18px;
      background: var(--ws-muted);
      border-radius: 999px;
      overflow: hidden;
    }

    .home-task-card .ws-progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--ws-primary) 0%, #F4A261 100%);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 1023px) {
      .ws-sidebar {
        width: 80px;
        padding: 24px 12px;
        align-items: center;
      }

      .ws-sidebar-logo {
        font-size: 14px;
        margin-bottom: 28px;
      }

      .ws-sidebar-logo span { display: none; }

      .ws-sidebar-item {
        justify-content: center;
        padding: 16px;
      }

      .ws-sidebar-item span { display: none; }

      .ws-sidebar-item svg { width: 36px; height: 36px; }

      .ws-page-content { margin-left: 80px; padding: 28px; }
    }

    @media (max-width: 767px) {
      .ws-sidebar { display: none; }
      .ws-page-content { margin-left: 0; padding: 24px; padding-bottom: 120px; }

      .home-header {
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
      }

      .home-badges { justify-content: flex-start; }

      .home-title { font-size: 36px; }

      .home-main {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .home-actions .ws-button {
        min-height: 64px;
        font-size: 24px;
        padding: 16px 28px;
      }

      .home-hero img { max-height: 320px; }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 88px;
        background: var(--ws-card);
        border-top: 2px dashed var(--ws-border);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 0 12px 8px;
        z-index: 100;
      }

      .mobile-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        background: transparent;
        border: none;
        color: var(--ws-muted-foreground);
        font-family: var(--ws-font-body);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        padding: 8px 14px;
        border-radius: var(--ws-radius-medium);
        transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      }

      .mobile-nav-item:hover,
      .mobile-nav-item:focus-visible {
        background: var(--ws-primary-50);
        color: var(--ws-primary);
        outline: none;
      }

      .mobile-nav-item:active { transform: scale(0.96); }

      .mobile-nav-item[data-active="true"] {
        color: var(--ws-primary);
        background: var(--ws-primary-100);
      }

      .mobile-nav-item svg {
        width: 28px;
        height: 28px;
        fill: currentColor;
      }
    }

    @media (min-width: 768px) {
      .mobile-nav { display: none; }
    }

    @media (min-width: 1440px) {
      .home-main { grid-template-columns: 1.35fr 1fr; gap: 48px; }
    }
  </style>
</head>
