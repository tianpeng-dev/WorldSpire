    --radius-sm: var(--ws-radius-small);
    --radius-md: var(--ws-radius-medium);
    --radius-lg: var(--ws-radius-large);
  }
  @layer base {
    body { background: var(--ws-background); color: var(--ws-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

  <link rel="stylesheet" href="../colors_and_type-storybook-draft.css">

  <style>
    body { padding-bottom: 0; }
    .ws-shell { background: #FFF8E7; }
    .ws-page-content { padding: 40px; margin-left: 220px; max-width: 1200px; }
    .ws-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: 100vh;
      background: linear-gradient(180deg, #E85D4C 0%, #F4A261 100%);
      display: flex;
      flex-direction: column;
      padding: 28px 16px;
      box-shadow: 4px 0 16px rgba(62, 39, 35, 0.12);
      z-index: 100;
    }
    .ws-sidebar-logo {
      color: #FFFFFF;
      font-family: var(--ws-font-display);
      font-size: 30px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 36px;
      text-shadow: 2px 2px 0 rgba(62, 39, 35, 0.15);
    }
    .ws-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ws-sidebar-item {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(255, 255, 255, 0.95);
      text-decoration: none;
      font-family: var(--ws-font-body);
      font-size: 20px;
      font-weight: 700;
      padding: 16px 18px;
      border-radius: var(--ws-radius-large);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .ws-sidebar-item:hover { background: rgba(255, 255, 255, 0.18); transform: translateX(4px); }
    .ws-sidebar-item svg,
    .ws-sidebar-item i {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .ws-content-inner {
      max-width: 960px;
      margin: 0 auto;
    }
    .voice-guide {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      text-align: center;
      gap: 28px;
    }
    .voice-guide .ws-hero {
      max-width: 480px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
    }
    .voice-guide .ws-title {
      font-size: 52px;
      margin-bottom: 8px;
    }
    .voice-guide .ws-subtitle {
      font-size: 28px;
      max-width: 600px;
    }
    .voice-guide .ws-mascot-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }
    .voice-guide .ws-mascot {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--ws-card);
      border: 3px solid var(--ws-border);
    }
    .voice-guide .ws-mascot-wrap .ws-card {
      padding: 20px 24px;
      max-width: 340px;
      text-align: left;
    }
    .voice-guide .ws-mascot-wrap .ws-card p {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .voice-guide .ws-button {
      min-width: 320px;
      min-height: 80px;
      font-size: 30px;
    }
    .voice-guide .ws-hint {
      font-size: 20px;
      color: var(--ws-muted-foreground);
      margin-top: 8px;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
<aside class="ws-sidebar" data-dom-id="ws-sidebar" aria-label="主导航">
  <div class="ws-sidebar-logo">词灵塔</div>
  <nav class="ws-sidebar-nav">
    <a href="home.html" class="ws-sidebar-item" data-dom-id="nav-home"><i data-lucide="home"></i><span>首页</span></a>
    <a href="map.html" class="ws-sidebar-item" data-dom-id="nav-map"><i data-lucide="map"></i><span>闯关</span></a>
    <a href="battle-lobby.html" class="ws-sidebar-item" data-dom-id="nav-battle"><i data-lucide="trophy"></i><span>对战</span></a>
    <a href="collection-characters.html" class="ws-sidebar-item" data-dom-id="nav-collection"><i data-lucide="image"></i><span>收藏</span></a>
    <a href="report.html" class="ws-sidebar-item" data-dom-id="nav-report"><i data-lucide="bar-chart-2"></i><span>报告</span></a>
  </nav>
</aside>
<main class="ws-shell" data-style="storybook">
  <div class="ws-page-content">
    <div class="ws-content-inner">
      <section class="voice-guide">
        <div class="ws-hero">
          <img src="../assets/hero-wordspire-storybook.jpg" alt="词灵塔" style="width:100%;height:auto;display:block;">
        </div>
        <h1 class="ws-title" data-dom-id="wg-title">词灵塔</h1>
        <p class="ws-subtitle" data-dom-id="wg-subtitle">没有大人陪，也能把英语玩会</p>
        <div class="ws-mascot-wrap" data-dom-id="wg-mascot">
          <img src="../assets/mascot-word-spirit.jpg" class="ws-mascot" alt="小塔">
          <div class="ws-card">
            <p>“你好呀，我是小塔，我们一起去闯关吧！”</p>
          </div>
        </div>
        <button class="ws-button" data-dom-id="wg-start" onclick="location.href='home.html'">开始冒险</button>
        <p class="ws-hint">全程语音引导，小朋友自己就能玩</p>
      </section>
    </div>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
