  <style>
    .ws-shell { background: #FFF8E7; }
    .ws-page-content { padding: 40px; margin-left: 220px; max-width: 1200px; }
    body { padding-bottom: 0; }

    .ws-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 220px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #E85D4C 0%, #F4A261 100%);
      color: #FFFFFF;
      padding: 32px 16px;
      gap: 16px;
      box-shadow: 4px 0 16px rgba(62, 39, 35, 0.12);
    }
    .ws-sidebar .ws-nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.16);
      border: none;
      border-radius: 16px;
      color: #FFFFFF;
      font-family: var(--ws-font-body);
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      padding: 16px 20px;
      transition: transform 0.15s ease, background 0.15s ease;
      text-align: left;
    }
    .ws-sidebar .ws-nav-item:hover { background: rgba(255, 255, 255, 0.28); }
    .ws-sidebar .ws-nav-item[data-active="true"] {
      background: #FFFFFF;
      color: #E85D4C;
      box-shadow: 0 4px 12px rgba(62, 39, 35, 0.12);
    }
    .ws-sidebar .ws-nav-item svg {
      width: 40px;
      height: 40px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .quiz-correct {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      text-align: center;
      gap: 32px;
      max-width: 960px;
      margin: 0 auto;
    }
    .correct-stars-wrap {
      font-size: 120px;
      animation: pop 0.5s ease;
      position: relative;
      line-height: 1;
    }
    .correct-stars-wrap .sparkle {
      position: absolute;
      font-size: 48px;
      animation: sparkle 1.2s ease-in-out infinite;
    }
    .correct-stars-wrap .sparkle:nth-child(1) { top: -20px; left: -40px; animation-delay: 0s; }
    .correct-stars-wrap .sparkle:nth-child(2) { top: -24px; right: -36px; animation-delay: 0.4s; }
    .correct-stars-wrap .sparkle:nth-child(3) { bottom: -16px; left: -24px; animation-delay: 0.8s; }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes sparkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 50% { transform: scale(1.3) rotate(15deg); opacity: 0.8; } }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
<main class="ws-shell" data-style="storybook">

      <span>闯关</span>
    </button>

      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>对战</span>
    </button>
    <button class="ws-nav-item" data-nav-key="collection" data-dom-id="nav-collection" onclick="location.href='collection-characters.html'">
      <svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
      <span>收藏</span>
    </button>
    <button class="ws-nav-item" data-nav-key="report" data-dom-id="nav-report" onclick="location.href='report.html'">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>报告</span>
    </button>
  </nav>

  <div class="ws-page-content">
    <section class="quiz-correct">
      <div class="correct-stars-wrap" data-dom-id="correct-stars">
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        ⭐ +1
      </div>
      <h1 class="ws-title" style="font-size:64px;color:var(--ws-state-success);margin:0;">答对啦！</h1>
      <div class="ws-card" style="max-width:560px;width:100%;padding:40px;" data-dom-id="correct-word">
        <p style="font-size:36px;font-weight:800;margin:0;">Apple</p>
        <p style="font-size:26px;color:var(--ws-muted-foreground);margin:12px 0 0;">苹果</p>
      </div>
      <button class="ws-button" style="min-width:320px;font-size:26px;padding:18px 40px;" data-dom-id="correct-next" onclick="location.href='quiz-question.html'">下一题</button>
    </section>
  </div>
</main>
<script>lucide.createIcons();</script>
